# Builds an unsigned TailorKeys.ipa on a GitHub-hosted Mac. Download it from the run's artifacts and sign
# and install it with Sideloadly (see ios/README.md).
name: iOS build

on:
  workflow_dispatch:
  push:
    paths: ["ios/**", "app/src/main/assets/words.txt", ".github/workflows/ios.yml"]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Build without signing
        run: |
          cd ios
          xcodebuild -project TailorKeys.xcodeproj -target TailorKeys -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package .ipa
        run: |
          cd ios
          mkdir -p Payload
          cp -R build/Release-iphoneos/TailorKeys.app Payload/
          zip -qr TailorKeys-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: TailorKeys-unsigned-ipa
          path: ios/TailorKeys-unsigned.ipa
