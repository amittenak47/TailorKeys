# XcodeGen spec. Run `xcodegen` on a Mac to generate TailorKeys.xcodeproj.
name: TailorKeys
options:
  bundleIdPrefix: app.tailorkeys
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    # The owner sets their Apple Developer team on both targets in Xcode.
    DEVELOPMENT_TEAM: ""
targets:
  TailorKeys:
    type: application
    platform: iOS
    sources:
      - App
      - Keyboard/KeyGrid.swift
      - Keyboard/KeyText.swift
      - Keyboard/Theme.swift
      - Keyboard/KeyboardSettings.swift
      - Keyboard/LayoutLibrary.swift
      - Keyboard/LayoutThumbnails.swift
      - Keyboard/TypingMetrics.swift
      - Keyboard/KeyboardView.swift
      - Keyboard/SwipeTrace.swift
      - Keyboard/CursorZones.swift
      - path: ../app/src/main/assets/NOTICE-dictionary.txt
        buildPhase: resources
    entitlements:
      path: App/TailorKeys.entitlements
      properties:
        com.apple.security.application-groups: [group.app.tailorkeys]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: TailorKeys
        CFBundleURLTypes:
          - CFBundleURLName: app.tailorkeys.settings
            CFBundleURLSchemes: [tailorkeys]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tailorkeys
    dependencies:
      - target: TailorKeysKeyboard
  TailorKeysKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - Keyboard
      # Same word list as the Android app.
      - path: ../app/src/main/assets/words.txt
        buildPhase: resources
      - path: ../app/src/main/assets/lm_en.bin
        buildPhase: resources
      - path: ../app/src/main/assets/bigrams.txt
        buildPhase: resources
      - path: ../app/src/main/assets/trigrams.txt
        buildPhase: resources
      - path: ../app/src/main/assets/words_es.txt
        buildPhase: resources
      - path: ../app/src/main/assets/bigrams_es.txt
        buildPhase: resources
      - path: ../app/src/main/assets/trigrams_es.txt
        buildPhase: resources
      - path: ../app/src/main/assets/words_de.txt
        buildPhase: resources
      - path: ../app/src/main/assets/bigrams_de.txt
        buildPhase: resources
      - path: ../app/src/main/assets/trigrams_de.txt
        buildPhase: resources
      - path: ../app/src/main/assets/words_fr.txt
        buildPhase: resources
      - path: ../app/src/main/assets/bigrams_fr.txt
        buildPhase: resources
      - path: ../app/src/main/assets/trigrams_fr.txt
        buildPhase: resources
      - path: ../app/src/main/assets/NOTICE-dictionary.txt
        buildPhase: resources
    entitlements:
      path: Keyboard/TailorKeysKeyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.app.tailorkeys]
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: TailorKeys
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            # Optional Full Access shares settings with the app; no network code is used.
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tailorkeys.keyboard
